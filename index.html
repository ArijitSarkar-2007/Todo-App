<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100">
   <div class="bg-white max-w-md mx-auto rounded-lg">

      <div class="bg-indigo-500 p-5 text-white font-semibold mt-15 rounded-t-md"> 
         <h1>ToDo App</h1>
      </div>

      <div class="p-5">

         <form id="todo-form" action="" class="flex gap-5">
            <input id="todo-input" class="border border-black rounded-sm flex-1 p-2" type="text"
               placeholder="Enter task description...">
            <div class="flex flex-col gap-3">
               <button id="form-btn" class="p-5 bg-violet-500 rounded-sm text-white">Add</button>

               <button type="button" id="cancel-btn"
                  class="hidden self-end text-xs text-slate-500 hover:text-slate-700 underline cursor-pointer">
                  Cancel Editing
               </button>
            </div>
         </form>

         <div class="flex justify-between pt-5 pb-2 text-sm border-b border-black">
            <p id="task-count">TASKS (1)</p>
            <p id="complete-count">COMPLETED : 1</p>
         </div>

         <ul id="todo-list" class="py-5 flex flex-col gap-1">
            <!-- <li data-id="1" class="flex gap-3 border border-slate-300 p-4 mt-5 rounded-xl">
               <input data-id="1" type="checkbox">
               <p class="flex-1">Go to gym</p>
               <div class="flex gap-5">
                  <button data-id="1">Edit</button>
                  <button data-id="1">Delete</button>
               </div>
            </li> -->
         </ul>
      </div>

   </div>

   <script src="index.js"></script>
</body>

</html>
